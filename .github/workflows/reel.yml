name: Reel

on:
  # Checks every 30 min; the "gate" job reads control.json and starts a Reel for a post hour P (a run takes ~50 min).
  # GitHub sometimes drops scheduled runs, so each slot gets 4 chances (P-1:35 … P+0:35, run ≈80 min);
  # the first one to run claims the slot in state/slots.txt so it never posts twice. DST-proof.
  # Post times, pause and skip days live in control.json (editable from the Control workflow on the phone).
  schedule:
    - cron: '5,35 * * * *'

  # "Run workflow" button (GitHub app/website)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic/angle for this video'
        required: false
        default: ''
      episode:
        description: 'Optional existing episode folder to render (e.g. episodes/005-my-idea)'
        required: false
        default: ''
      publish:
        description: 'Post to Instagram when done'
        type: boolean
        default: true

  # Post-on-demand from a chat: commit requests/run.json → a run starts
  push:
    branches: [main]
    paths: ['requests/run.json']

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "manual run → go"; exit 0; fi
          H=$(TZ=America/New_York date +%-H); D=$(TZ=America/New_York date +%F)
          nogo() { echo "NY $D ${H}:xx → $1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          jq -e '.paused' control.json >/dev/null && nogo "paused"
          jq -e --arg d "$D" '(.skipDates // []) | index($d)' control.json >/dev/null && nogo "skipped day"
          # A run takes ~80 min. Serve post hour P when P is 45–100 min away (normal: the P-2:35 or P-1:05 check),
          # or up to 40 min past it (catch-up if earlier checks were dropped). Each slot is claimed once.
          M=$(( 10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M) ))
          for P in $(jq -r '(.postHours // [])[]' control.json); do
            DELTA=$(( P * 60 - M ))
            [ $DELTA -le 100 ] && [ $DELTA -ge -40 ] || continue
            SLOT="$D $P"
            if grep -qx "$SLOT" state/slots.txt 2>/dev/null; then nogo "slot $SLOT already started"; fi
            mkdir -p state; echo "$SLOT" >> state/slots.txt; tail -n 60 state/slots.txt > s.tmp && mv s.tmp state/slots.txt
            git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
            git add state/slots.txt && git commit -qm "Claim slot $SLOT"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            echo "NY $D ${H}:xx → starting Reel for ${P}:00 slot ($DELTA min before)"; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          done
          nogo "not a post slot"

  # 1) script + voice + captions, and a plan that splits the 3D footage into slices
  prepare:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      render: ${{ steps.prep.outputs.render }}
      dir: ${{ steps.prep.outputs.dir }}
      pieces: ${{ steps.prep.outputs.pieces }}
      publish: ${{ steps.req.outputs.publish }}
      quality: ${{ steps.req.outputs.quality }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve request
        id: req
        env:
          EVENT: ${{ github.event_name }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_EPISODE: ${{ github.event.inputs.episode }}
          IN_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          TOPIC="$IN_TOPIC"; EPISODE="$IN_EPISODE"; PUBLISH="${IN_PUBLISH:-true}"; POST_VIDEO=""; QUALITY=""
          if [ "$EVENT" = "push" ]; then
            TOPIC=$(jq -r '.topic // ""' requests/run.json)
            EPISODE=$(jq -r '.episode // ""' requests/run.json)
            PUBLISH=$(jq -r 'if .publish == false then "false" else "true" end' requests/run.json)
            POST_VIDEO=$(jq -r '.postVideo // ""' requests/run.json)
            QUALITY=$(jq -r '.quality // ""' requests/run.json)
          fi
          {
            echo "topic<<EOF"; echo "$TOPIC"; echo "EOF"
            echo "episode=$EPISODE"
            echo "publish=$PUBLISH"
            echo "post_video=$POST_VIDEO"
            echo "quality=$QUALITY"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT topic='$TOPIC' episode='$EPISODE' publish=$PUBLISH quality='$QUALITY'"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          sudo curl -sSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-v1

      - name: Write script, voice, captions (or post an existing video)
        id: prep
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'am_adam' }}
          KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '1.08' }}
          CLOUDFLARED_BIN: /usr/local/bin/cloudflared
          REEL_TOPIC: ${{ steps.req.outputs.topic }}
          REEL_EPISODE: ${{ steps.req.outputs.episode }}
          POST_VIDEO: ${{ steps.req.outputs.post_video }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fast path: post an already-rendered video from the "videos" release (no re-render).
          if [ -n "$POST_VIDEO" ]; then
            ID=$(basename "$POST_VIDEO")
            mkdir -p out/posted && gh release download videos -p "$ID.mp4" -D out/posted --clobber
            node pipeline/publish.mjs "out/posted/$ID.mp4" "episodes/$ID"
            echo "render=false" >> "$GITHUB_OUTPUT"
            git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
            git add posted.log && git commit -qm "Posted $ID" && { git pull --rebase && git push; } || true
            exit 0
          fi
          ARGS=()
          [ -n "$REEL_EPISODE" ] && ARGS+=(--episode "$REEL_EPISODE")
          [ -n "$REEL_TOPIC" ] && ARGS+=(--topic "$REEL_TOPIC")
          node pipeline/parallel.mjs prepare "${ARGS[@]}"
          echo "render=true" >> "$GITHUB_OUTPUT"

      - name: Hand off to the capture jobs
        if: steps.prep.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: ${{ steps.prep.outputs.dir }}
          retention-days: 3

  # 2) the 3D footage, sliced across many machines at once
  capture:
    needs: prepare
    if: needs.prepare.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        piece: ${{ fromJSON(needs.prepare.outputs.pieces) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: episode
          path: ${{ needs.prepare.outputs.dir }}
      - name: Render slice ${{ matrix.piece }}
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CAPTURE_QUALITY: ${{ needs.prepare.outputs.quality }}
        run: node pipeline/parallel.mjs capture "${{ needs.prepare.outputs.dir }}" ${{ matrix.piece }}
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.piece }}
          path: ${{ needs.prepare.outputs.dir }}/frames
          retention-days: 3

  # 3) stitch footage + motion graphics, post, share link, log
  reel:
    needs: [prepare, capture]
    if: needs.prepare.outputs.render == 'true'
    # one post at a time
    concurrency:
      group: reel
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          sudo curl -sSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: episode
          path: ${{ needs.prepare.outputs.dir }}

      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          merge-multiple: true
          path: ${{ needs.prepare.outputs.dir }}/frames

      - name: Make (and post) the Reel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          CLOUDFLARED_BIN: /usr/local/bin/cloudflared
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          CAPTURE_QUALITY: ${{ needs.prepare.outputs.quality }}
        run: |
          ARGS=(--episode "${{ needs.prepare.outputs.dir }}" --force)
          [ "$PUBLISH" = "false" ] && ARGS+=(--dry-run)
          node pipeline/daily.mjs "${ARGS[@]}"

      - name: Keep Instagram token alive
        if: always()
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$INSTAGRAM_ACCESS_TOKEN" \
            | jq '{expires_in_days: ((.expires_in // 0) / 86400 | floor), error: .error.message}'

      - name: Public watch link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F=$(ls out/*.mp4 2>/dev/null | head -1); [ -n "$F" ] || exit 0
          mkdir -p out/share; S="out/share/$(basename "$F")"
          ffmpeg -loglevel error -y -i "$F" -c:v libx264 -preset veryfast -b:v 4500k -maxrate 5500k -bufsize 11M -c:a aac -b:a 160k -movflags +faststart "$S"
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "Reel videos" --notes "Every rendered Reel. Tap a file to watch it on your phone."
          gh release upload videos "$S" --clobber
          echo "▶ Watch: https://github.com/${{ github.repository }}/releases/download/videos/$(basename "$F")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Save episode + post log
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add episodes/*/episode.json posted.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Reel run ${{ github.run_number }} ($(date -u +%F))"
            git pull --rebase && git push
          fi
