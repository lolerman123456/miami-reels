name: Reel

on:
  # Two Reels a day, posted ~1pm and ~8pm New York time. A run takes ~50 min, so runs start at 12:05 and 19:05 NY.
  # Cron is UTC and doesn't know about daylight saving, so we fire at both the EDT and EST times and the
  # "gate" job below only lets through the one that matches START_HOURS in New York.
  # To change post times: edit START_HOURS (NY start hours = post hour − 1) and the matching crons (NY hour +4 and +5).
  schedule:
    - cron: '5 16,17,23 * * *'
    - cron: '5 0 * * *'

  # "Run workflow" button (GitHub app/website)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic/angle for this video'
        required: false
        default: ''
      episode:
        description: 'Optional existing episode folder to render (e.g. episodes/005-my-idea)'
        required: false
        default: ''
      publish:
        description: 'Post to Instagram when done'
        type: boolean
        default: true

  # Post-on-demand from a chat: commit requests/run.json → a run starts
  push:
    branches: [main]
    paths: ['requests/run.json']

permissions:
  contents: write

concurrency:
  group: reel
  cancel-in-progress: false

env:
  START_HOURS: '12,19'   # New York hours when scheduled runs start (→ posts ~1pm and ~8pm)

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          H=$(TZ=America/New_York date +%-H)
          if [ "$EVENT" != "schedule" ] || [[ ",$START_HOURS," == *",$H,"* ]]; then echo "go=true" >> "$GITHUB_OUTPUT"; echo "go (NY hour $H)"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "skip: NY hour $H not in $START_HOURS (other daylight-saving slot)"; fi

  reel:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Resolve request
        id: req
        env:
          EVENT: ${{ github.event_name }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_EPISODE: ${{ github.event.inputs.episode }}
          IN_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          TOPIC="$IN_TOPIC"; EPISODE="$IN_EPISODE"; PUBLISH="${IN_PUBLISH:-true}"
          if [ "$EVENT" = "push" ]; then
            TOPIC=$(jq -r '.topic // ""' requests/run.json)
            EPISODE=$(jq -r '.episode // ""' requests/run.json)
            PUBLISH=$(jq -r 'if .publish == false then "false" else "true" end' requests/run.json)
          fi
          {
            echo "topic<<EOF"; echo "$TOPIC"; echo "EOF"
            echo "episode=$EPISODE"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT topic='$TOPIC' episode='$EPISODE' publish=$PUBLISH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          sudo curl -sSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-v1

      - name: Make (and post) the Reel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'am_adam' }}
          KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '1.08' }}
          CLOUDFLARED_BIN: /usr/local/bin/cloudflared
          REEL_TOPIC: ${{ steps.req.outputs.topic }}
          REEL_EPISODE: ${{ steps.req.outputs.episode }}
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ steps.req.outputs.publish }}
        run: |
          ARGS=""
          [ "$PUBLISH" = "false" ] && ARGS="$ARGS --dry-run"
          [ "$EVENT" != "schedule" ] && ARGS="$ARGS --force"
          node pipeline/daily.mjs $ARGS

      - name: Keep Instagram token alive
        if: always()
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$INSTAGRAM_ACCESS_TOKEN" \
            | jq '{expires_in_days: ((.expires_in // 0) / 86400 | floor), error: .error.message}'

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Save episode + post log
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add episodes/*/episode.json posted.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Reel run ${{ github.run_number }} ($(date -u +%F))"
            git pull --rebase && git push
          fi
