name: Slideshow

# Hand-made TikTok photo slideshow → Buffer reminder (the owner adds a sound and posts).
# Commit slideshows/<id>/ (slides.json, logos/, optional out/*.jpg) and requests/slideshow.json → {"dir": "slideshows/<id>", "at": "<ISO>"}.
on:
  push:
    branches: [main]
    paths: ['requests/slideshow.json', 'requests/buffer-status.json', 'requests/tiktok-batch.json']

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Buffer status (TikTok)
        if: contains(github.event.head_commit.message, 'Buffer status')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node pipeline/buffer.mjs --status
      - name: TikTok batch (a day's reminders at set times)
        if: contains(github.event.head_commit.message, 'TikTok batch')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node pipeline/buffer.mjs --batch requests/tiktok-batch.json
      - name: Send to Buffer
        if: "!contains(github.event.head_commit.message, 'Buffer status') && !contains(github.event.head_commit.message, 'TikTok batch')"
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node pipeline/slideshow.mjs send "$(jq -r .dir requests/slideshow.json)"
      - name: Save posted.log
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add posted.log && git commit -qm "TikTok reminders sent to Buffer" && { for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep $((i*5)); done; } || true
