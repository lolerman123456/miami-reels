name: Stats

# Weekly growth review: followers + per-post reach/likes/comments → state/stats.json.
# Commit requests/stats.json → {"days": 8, "at": "<ISO timestamp>"}.
on:
  push:
    branches: [main]
    paths: ['requests/stats.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pull stats
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node pipeline/stats.mjs "$(jq -r '.days // 8' requests/stats.json 2>/dev/null || echo 8)"
      - name: Save stats
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add state/stats.json state/peek-*.json 2>/dev/null; git add state/stats.json && git commit -qm "Weekly stats" && { git pull -q --rebase && git push -q; } || true
