name: Agency video test
on:
  push:
    branches: [main]
    paths: ['requests/ytdl-test.json']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          pip install -q yt-dlp
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1 || true
          export PATH="$HOME/.deno/bin:$PATH"
          for id in p4cP9_T6rVo; do
            yt-dlp -f "b[ext=mp4]/b" --download-sections "*0-20" -o "t.%(ext)s" "https://www.youtube.com/watch?v=$id" 2>&1 | tail -6
          done
          ls -la
          echo "--- vimeo/x probes"
          yt-dlp --simulate --print "%(title)s" "https://x.com/MiamiDadeSO" 2>&1 | tail -2 || true
