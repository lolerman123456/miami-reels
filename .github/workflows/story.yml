name: Story

# One-off Instagram story (a graphic made in a chat, e.g. a call for submissions).
# Commit requests/story.json → {"file": "stories/<name>.jpg", "at": "<ISO timestamp>"}.
on:
  push:
    branches: [main]
    paths: ['requests/story.json']

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: cloudflared
        run: |
          sudo curl -sSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
      - name: Post story
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          CLOUDFLARED_BIN: /usr/local/bin/cloudflared
        run: node pipeline/story.mjs "$(jq -r .file requests/story.json)"
      - name: Save posted.log
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add posted.log && git commit -qm "Posted story" && { git pull -q --rebase && git push -q; } || true
