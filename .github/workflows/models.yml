name: List OpenAI models

# Free call: lists the models this account can use (to pick cheaper ones). Trigger: push requests/models.json.
on:
  push:
    branches: [main]
    paths: ['requests/models.json']
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          curl -s https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY" | jq -r '.data[].id' | grep -E '^(gpt|o[0-9]|chatgpt)' | sort | tee -a "$GITHUB_STEP_SUMMARY"
