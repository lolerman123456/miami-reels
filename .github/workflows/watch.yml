name: Watch

# Hourly: log the public posts of reference accounts (control.json → watchAccounts, default @onlyindade) via the
# Instagram Graph API business_discovery field → state/watch/<user>.md + .jsonl. Manual: commit requests/watch.json.
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['requests/watch.json', 'pipeline/watch.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch reference accounts
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: node pipeline/watch.mjs
      - name: Save
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add state/watch && git commit -qm "Watch: reference accounts" && { for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done; } || true
